<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <title>404 — Lost in Space | AstroVeda</title>
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    .four-o-four {
      font-family: var(--font-h);
      font-size: clamp(7rem, 20vw, 14rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, rgba(201,169,110,.25) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
      margin-bottom: 0;
      letter-spacing: -.05em;
      user-select: none;
    }
    .orbit {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 1px dashed rgba(201,169,110,.22);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: orbitSpin 12s linear infinite;
    }
    .orbit::after {
      content: '✦';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--accent);
      font-size: 1.2rem;
    }
    .orbit2 {
      width: 320px; height: 320px;
      animation-duration: 20s;
      animation-direction: reverse;
    }
    @keyframes orbitSpin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  </style>
</head>
<body style="background:var(--primary); color:#fff;">

<div class="fullscreen-section position-relative overflow-hidden">

  <!-- Radial glow -->
  <div style="position:absolute; width:600px; height:600px; top:50%; left:50%; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(201,169,110,.07) 0%, transparent 65%); pointer-events:none;" aria-hidden="true"></div>

  <!-- Orbiting rings -->
  <div class="orbit" aria-hidden="true"></div>
  <div class="orbit orbit2" aria-hidden="true"></div>

  <div class="container position-relative" style="z-index:2;">
    <div class="reveal-up">
      <!-- Big 404 -->
      <span class="four-o-four" aria-hidden="true">404</span>

      <h1 class="h-font text-white mb-3 mt-2" style="font-size:clamp(1.6rem, 4vw, 2.8rem);">
        Lost in the Universe?
      </h1>
      <p class="mb-5 mx-auto" style="color:rgba(255,255,255,.6); max-width:500px; font-size:1.05rem; line-height:1.7;">
        Even the stars get misaligned. The page you're looking for has drifted into a black hole.
        Let us guide you back.
      </p>

      <!-- Suggestions -->
      <div class="d-flex flex-wrap gap-3 justify-content-center mb-5">
        <a href="index.html" class="btn-gold" style="text-decoration:none;">
          <i class="bi bi-house-fill me-2" aria-hidden="true"></i> Back to Home
        </a>
        <a href="services.html" class="btn-ghost text-white" style="text-decoration:none; border-color:rgba(255,255,255,.3);">
          Explore Services
        </a>
        <a href="contact.html" class="btn-ghost text-white" style="text-decoration:none; border-color:rgba(255,255,255,.3);">
          Contact Support
        </a>
      </div>

      <!-- Quick links -->
      <p style="color:rgba(255,255,255,.35); font-size:.82rem; margin-bottom:16px;">Or try one of these:</p>
      <div class="d-flex flex-wrap justify-content-center gap-4" style="font-size:.85rem;">
        <a href="book-consultation.html" class="text-accent text-decoration-none"><i class="bi bi-calendar-check me-1"></i> Book a Session</a>
        <a href="about.html"             class="text-accent text-decoration-none"><i class="bi bi-person me-1"></i> About Us</a>
        <a href="login.html"             class="text-accent text-decoration-none"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
