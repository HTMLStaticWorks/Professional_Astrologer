<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (() => {
      const saved = localStorage.getItem('av_theme');
      const savedDir = localStorage.getItem('av_dir');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (systemDark ? 'dark' : 'light'));
      if (savedDir === 'rtl' || savedDir === 'ltr') {
        document.documentElement.setAttribute('dir', savedDir);
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <title>Create Account | AstroVeda â€” Start Your Cosmic Journey</title>
  <meta name="description" content="Create your free AstroVeda account and start your personalized astrology journey today.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-controls">
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
      <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
    </button>
    <button id="rtl-toggle" class="rtl-btn" aria-label="Switch direction">RTL</button>
  </div>
  <div class="container">
    <div class="auth-card reveal-up" style="max-width:520px;">
      <!-- Brand -->
      <div class="text-center mb-5">
        <a href="index.html" class="auth-brand text-decoration-none d-inline-block mb-4">
          <span class="h-font fw-bold text-accent" style="font-size:2rem; letter-spacing:-.03em;">
            <i class="bi bi-stars" aria-hidden="true"></i> AstroVeda
          </span>
        </a>
        <h1 class="h3 h-font auth-title mb-2">Create Your Account</h1>
        <p class="auth-subtitle" style="font-size:.9rem;">Free forever. No credit card required.</p>
      </div>

      <!-- Benefits strip -->
      <div class="d-flex flex-wrap gap-3 justify-content-center mb-5">
        <span class="auth-benefit-pill">
          <i class="bi bi-check-circle text-accent me-1" aria-hidden="true"></i> Free Birth Chart Preview
        </span>
        <span class="auth-benefit-pill">
          <i class="bi bi-check-circle text-accent me-1" aria-hidden="true"></i> Dashboard Access
        </span>
        <span class="auth-benefit-pill">
          <i class="bi bi-check-circle text-accent me-1" aria-hidden="true"></i> Secure &amp; Private
        </span>
      </div>

      <!-- Form -->
      <form id="reg-form" onsubmit="handleRegister(event);" novalidate>
        <div class="mb-4">
          <label for="r-name" class="form-label small fw-semibold auth-label">Full Name</label>
          <input id="r-name" type="text" class="form-field" placeholder="Jane Doe" autocomplete="name" required
                 aria-required="true">
        </div>

        <div class="mb-4">
          <label for="r-email" class="form-label small fw-semibold auth-label">Email Address</label>
          <input id="r-email" type="email" class="form-field" placeholder="you@example.com" autocomplete="email" required
                 aria-required="true">
        </div>

        <div class="mb-4">
          <label for="r-password" class="form-label small fw-semibold auth-label">Password</label>
          <div class="position-relative">
            <input id="r-password" type="password" class="form-field" placeholder="At least 8 characters" required
                   style="padding-inline-end:46px;" aria-required="true" oninput="checkStrength(this.value)">
            <button type="button" onclick="togglePwd('r-password','eye-reg')"
                    class="position-absolute top-50 translate-middle-y end-0 me-3 border-0 bg-transparent p-0 auth-input-toggle"
                    style="cursor:pointer;" aria-label="Show or hide password">
              <i id="eye-reg" class="bi bi-eye" aria-hidden="true"></i>
            </button>
          </div>
          <!-- Strength bar -->
          <div class="mt-2 d-flex gap-1" aria-label="Password strength indicator">
            <div id="s1" class="auth-strength-bar"></div>
            <div id="s2" class="auth-strength-bar"></div>
            <div id="s3" class="auth-strength-bar"></div>
            <div id="s4" class="auth-strength-bar"></div>
          </div>
          <p id="strength-label" class="small mt-1 auth-strength-label" style="font-size:.75rem; min-height:18px;"></p>
        </div>

        <div class="mb-5">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="r-terms" required aria-required="true">
            <label class="form-check-label auth-check-label" for="r-terms" style="font-size:.85rem;">
              I agree to the <a href="#" class="text-accent text-decoration-none">Terms of Service</a> and
              <a href="#" class="text-accent text-decoration-none">Privacy Policy</a>
            </label>
          </div>
        </div>

        <button type="submit" class="btn-gold w-100" style="padding:14px; font-size:1rem; justify-content:center;" id="reg-btn">
          Create Account <i class="bi bi-arrow-right ms-2" aria-hidden="true"></i>
        </button>
      </form>

      <!-- Divider -->
      <div class="d-flex align-items-center gap-3 my-5">
        <hr class="auth-divider" style="flex:1;">
        <span class="auth-divider-text" style="font-size:.78rem;">or sign up with</span>
        <hr class="auth-divider" style="flex:1;">
      </div>

      <!-- Social logins -->
      <div class="row g-3 mb-5">
        <div class="col-4">
          <button class="w-100 py-3 border rounded-2 auth-social-btn d-flex align-items-center justify-content-center gap-2"
                  aria-label="Sign up with Google">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span class="d-none d-md-inline">Google</span>
          </button>
        </div>
        <div class="col-4">
          <button class="w-100 py-3 border rounded-2 auth-social-btn d-flex align-items-center justify-content-center gap-2"
                  aria-label="Sign up with Facebook">
            <i class="bi bi-facebook" style="color:#4267B2;" aria-hidden="true"></i>
            <span class="d-none d-md-inline">Facebook</span>
          </button>
        </div>
        <div class="col-4">
          <button class="w-100 py-3 border rounded-2 auth-social-btn d-flex align-items-center justify-content-center gap-2"
                  aria-label="Sign up with Apple">
            <i class="bi bi-apple" style="color:var(--text);" aria-hidden="true"></i>
            <span class="d-none d-md-inline">Apple</span>
          </button>
        </div>
      </div>

      <p class="text-center mt-5 mb-0 auth-footer-note" style="font-size:.87rem;">
        Already have an account?
        <a href="login.html" class="text-accent text-decoration-none fw-semibold">Sign In</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
<script>
  function togglePwd(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
  }

  function checkStrength(val) {
    const s     = [document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3'),document.getElementById('s4')];
    const label = document.getElementById('strength-label');
    const colors = ['#ef4444','#f97316','#eab308','#22c55e'];
    const labels = ['Too weak','Fair','Good','Strong âœ¦'];
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const baseBar = isDark ? 'rgba(255,255,255,.1)' : 'rgba(15,23,42,.12)';
    const baseLabel = isDark ? 'rgba(255,255,255,.35)' : '#6b7280';
    let score = 0;
    if (val.length >= 8)         score++;
    if (/[A-Z]/.test(val))       score++;
    if (/[0-9]/.test(val))       score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    s.forEach((el, i) => {
      el.style.background = i < score ? colors[score - 1] : baseBar;
    });
    label.textContent   = val ? labels[score - 1] || '' : '';
    label.style.color   = val && score > 0 ? colors[score - 1] : baseLabel;
  }

  function handleRegister(e) {
    e.preventDefault();
    const terms = document.getElementById('r-terms').checked;
    if (!terms) { alert('Please accept the Terms of Service to continue.'); return; }
    const btn = document.getElementById('reg-btn');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating accountâ€¦';
    btn.disabled  = true;
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1400);
  }
</script>
</body>
</html>
